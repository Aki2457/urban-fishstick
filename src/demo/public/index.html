<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
      --border: #d5d9e0; --accent: #2557d6; --accent-text: #ffffff;
      --error: #b42318; --error-bg: #fdecea; --ok: #1a7f37; --notice-bg: #eef3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #2f353d; --accent: #6b93ff; --accent-text: #0b0d10;
        --error: #ff8a80; --error-bg: #3a1c1a; --ok: #56d364; --notice-bg: #1d2740;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
           border-radius: 10px; padding: 28px 24px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=email], input[type=password], input[type=date] {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    .field-error { color: var(--error); font-size: .85rem; margin-top: 4px; }
    .banner { padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; font-size: .9rem; }
    .banner.error { background: var(--error-bg); color: var(--error); }
    .banner.notice { background: var(--notice-bg); }
    button { width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 6px;
             background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .link { background: none; color: var(--accent); padding: 8px 0 0; font-weight: 500; }
    .status { font-size: 2rem; margin-bottom: 8px; }
    .status.success { color: var(--ok); } .status.failure { color: var(--error); }
    .footer { margin-top: 18px; font-size: .85rem; text-align: center; }
    .footer a { color: var(--accent); }
    .problems { margin: 0 0 16px; padding-left: 18px; color: var(--error); font-size: .9rem; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"><p>Loading…</p></main>
  <script src="/vendor/webauthn.js"></script>
  <script>
    const app = document.getElementById("app");
    let view = null;
    const builderFlow = new URLSearchParams(location.search).get("flow");

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v === undefined || v === null || v === false) continue;
        if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      }
      for (const c of children) if (c != null) node.append(c);
      return node;
    }

    async function call(url, body) {
      const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
      const data = await res.json();
      if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { status: res.status, problems: data.problems });
      return data;
    }

    async function start() {
      const url = builderFlow ? `/api/builder/flows/${encodeURIComponent(builderFlow)}/run` : "/api/flows/login/start";
      try { render(await call(url)); }
      catch (e) { renderFatal(e.message, e.problems); }
    }

    function render(v) {
      view = v;
      app.replaceChildren();
      if (v.type === "complete") return renderComplete(v);

      app.append(el("h1", {}, v.title));
      const subtitle = v.description || (v.data && v.data.description) || (v.data && v.data.email && `Signing in as ${v.data.email}`) ||
                       (v.data && v.data.sentTo && `We sent a 6-digit code to ${v.data.sentTo}.`);
      if (subtitle) app.append(el("p", {}, subtitle));
      if (v.error) app.append(el("div", { class: "banner error", role: "alert" }, v.error));
      if (v.data && v.data.notice) app.append(el("div", { class: "banner notice" }, v.data.notice));

      const form = el("form", { novalidate: true, onsubmit: onSubmit });
      let firstInput = null;
      for (const f of v.fields) {
        const id = `f-${f.name}`;
        const err = v.fieldErrors && v.fieldErrors[f.name];
        const errId = err ? `${id}-err` : undefined;
        if (f.type === "passkey") continue; // handled by the submit button
        if (f.type === "checkbox") {
          form.append(el("div", { class: "field" },
            el("label", { class: "check", for: id }, el("input", { type: "checkbox", id, name: f.name }), f.label)));
          continue;
        }
        const input = el("input", {
          id, name: f.name,
          type: f.type === "otp" ? "text" : f.type,
          inputmode: f.type === "otp" ? "numeric" : undefined,
          autocomplete: f.autocomplete, placeholder: f.placeholder,
          maxlength: f.maxLength, required: f.required,
          "aria-invalid": err ? "true" : undefined, "aria-describedby": errId,
        });
        firstInput = firstInput || input;
        form.append(el("div", { class: "field" }, el("label", { for: id }, f.label), input,
          err ? el("div", { class: "field-error", id: errId }, err) : null));
      }
      form.append(el("button", { type: "submit" }, v.submitLabel));
      app.append(form);
      if (builderFlow) app.append(backLink());
      const passkeyError = v.fieldErrors && v.fields.some((f) => f.type === "passkey" && v.fieldErrors[f.name]);
      if (passkeyError) app.insertBefore(el("div", { class: "banner error", role: "alert" }, Object.values(v.fieldErrors)[0]), form);
      (form.querySelector("[aria-invalid=true]") || firstInput || form.querySelector("button"))?.focus();
    }

    function backLink() {
      return el("div", { class: "footer" }, el("a", { href: "/" }, "Back to the whiteboard"));
    }

    // Runs the browser passkey prompt and returns the response as JSON text, or null if the user cancelled.
    async function runPasskey(passkey) {
      const lib = window.SimpleWebAuthnBrowser;
      if (!lib || !lib.browserSupportsWebAuthn()) throw new Error("This browser does not support passkeys.");
      const result = passkey.mode === "register"
        ? await lib.startRegistration({ optionsJSON: passkey.options })
        : await lib.startAuthentication({ optionsJSON: passkey.options });
      return JSON.stringify(result);
    }

    async function onSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const input = {};
      const button = form.querySelector("button");
      button.disabled = true;
      for (const f of view.fields) {
        if (f.type === "passkey") {
          try { input[f.name] = await runPasskey(view.data.passkey); }
          catch (e) {
            // Cancelling the browser prompt lands here. Stay on the screen and let the user try again.
            const msg = e && e.name === "NotAllowedError" ? "The passkey prompt was closed or timed out. Try again." : (e.message || "Passkey failed.");
            form.parentNode.querySelector(".banner.error")?.remove();
            form.before(el("div", { class: "banner error", role: "alert" }, msg));
            button.disabled = false;
            return;
          }
          continue;
        }
        const node = form.elements[f.name];
        input[f.name] = f.type === "checkbox" ? node.checked : node.value;
      }
      try { render(await call(`/api/sessions/${view.sessionId}/submit`, { nodeId: view.nodeId, input })); }
      catch (e) { e.status === 410 ? renderFatal("Your sign-in session expired.") : renderFatal(e.message); }
    }

    function renderComplete(v) {
      app.append(
        el("div", { class: `status ${v.status}`, "aria-hidden": "true" }, v.status === "success" ? "✓" : "✕"),
        el("h1", {}, v.title),
        v.message ? el("p", {}, v.message) : null,
        el("button", { class: "link", type: "button", onclick: start }, v.status === "success" ? "Sign in again" : "Start over"),
        builderFlow ? backLink() : null,
      );
    }

    function renderFatal(message, problems) {
      const list = problems && problems.length
        ? el("ul", { class: "problems" }, ...problems.filter((p) => p.level === "error").map((p) => el("li", {}, p.message)))
        : null;
      app.replaceChildren(el("h1", {}, "Can't run this flow"), el("p", {}, message), list,
        el("button", { type: "button", onclick: start }, "Try again"), builderFlow ? backLink() : null);
    }

    start();
  </script>
</body>
</html>
