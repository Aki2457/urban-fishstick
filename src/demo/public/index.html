<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
      --border: #d5d9e0; --accent: #2557d6; --accent-text: #ffffff;
      --error: #b42318; --error-bg: #fdecea; --ok: #1a7f37; --notice-bg: #eef3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #2f353d; --accent: #6b93ff; --accent-text: #0b0d10;
        --error: #ff8a80; --error-bg: #3a1c1a; --ok: #56d364; --notice-bg: #1d2740;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
           border-radius: 10px; padding: 28px 24px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    .field-error { color: var(--error); font-size: .85rem; margin-top: 4px; }
    .banner { padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; font-size: .9rem; }
    .banner.error { background: var(--error-bg); color: var(--error); }
    .banner.notice { background: var(--notice-bg); }
    button { width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 6px;
             background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .link { background: none; color: var(--accent); padding: 8px 0 0; font-weight: 500; }
    .status { font-size: 2rem; margin-bottom: 8px; }
    .status.success { color: var(--ok); } .status.failure { color: var(--error); }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"><p>Loading…</p></main>
  <script>
    const app = document.getElementById("app");
    let view = null;

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v === undefined || v === null || v === false) continue;
        if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      }
      for (const c of children) if (c != null) node.append(c);
      return node;
    }

    async function call(url, body) {
      const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
      const data = await res.json();
      if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { status: res.status });
      return data;
    }

    async function start() {
      try { render(await call("/api/flows/login/start")); }
      catch (e) { renderFatal(e.message); }
    }

    function render(v) {
      view = v;
      app.replaceChildren();
      if (v.type === "complete") return renderComplete(v);

      app.append(el("h1", {}, v.title));
      const subtitle = v.description || (v.data && v.data.email && `Signing in as ${v.data.email}`) ||
                       (v.data && v.data.sentTo && `We sent a 6-digit code to ${v.data.sentTo}.`);
      if (subtitle) app.append(el("p", {}, subtitle));
      if (v.error) app.append(el("div", { class: "banner error", role: "alert" }, v.error));
      if (v.data && v.data.notice) app.append(el("div", { class: "banner notice" }, v.data.notice));

      const form = el("form", { novalidate: true, onsubmit: onSubmit });
      let firstInput = null;
      for (const f of v.fields) {
        const id = `f-${f.name}`;
        const err = v.fieldErrors && v.fieldErrors[f.name];
        const errId = err ? `${id}-err` : undefined;
        if (f.type === "checkbox") {
          form.append(el("div", { class: "field" },
            el("label", { class: "check", for: id }, el("input", { type: "checkbox", id, name: f.name }), f.label)));
          continue;
        }
        const input = el("input", {
          id, name: f.name,
          type: f.type === "otp" ? "text" : f.type,
          inputmode: f.type === "otp" ? "numeric" : undefined,
          autocomplete: f.autocomplete, placeholder: f.placeholder,
          maxlength: f.maxLength, required: f.required,
          "aria-invalid": err ? "true" : undefined, "aria-describedby": errId,
        });
        firstInput = firstInput || input;
        form.append(el("div", { class: "field" }, el("label", { for: id }, f.label), input,
          err ? el("div", { class: "field-error", id: errId }, err) : null));
      }
      form.append(el("button", { type: "submit" }, v.submitLabel));
      app.append(form);
      (form.querySelector("[aria-invalid=true]") || firstInput)?.focus();
    }

    async function onSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const input = {};
      for (const f of view.fields) {
        const node = form.elements[f.name];
        input[f.name] = f.type === "checkbox" ? node.checked : node.value;
      }
      form.querySelector("button").disabled = true;
      try { render(await call(`/api/sessions/${view.sessionId}/submit`, { nodeId: view.nodeId, input })); }
      catch (e) { e.status === 410 ? renderFatal("Your sign-in session expired.") : renderFatal(e.message); }
    }

    function renderComplete(v) {
      app.append(
        el("div", { class: `status ${v.status}`, "aria-hidden": "true" }, v.status === "success" ? "✓" : "✕"),
        el("h1", {}, v.title),
        v.message ? el("p", {}, v.message) : null,
        el("button", { class: "link", type: "button", onclick: start }, v.status === "success" ? "Sign in again" : "Start over"),
      );
    }

    function renderFatal(message) {
      app.replaceChildren(el("h1", {}, "Something went wrong"), el("p", {}, message),
        el("button", { type: "button", onclick: start }, "Start over"));
    }

    start();
  </script>
</body>
</html>
