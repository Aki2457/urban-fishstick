<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/assets/flow-client.css">
  <style>
    :root { --bg: #f4f5f7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111418; } }
    :root[data-theme="dark"] { --bg: #111418; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); }
    main { width: 100%; max-width: 380px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="/vendor/webauthn.js"></script>
  <script src="/assets/flow-client.js"></script>
  <script>
    // /run?flow=<id> runs a whiteboard flow; /login runs the hand-written login flow.
    const flow = new URLSearchParams(location.search).get("flow");
    const startUrl = flow ? `/api/builder/flows/${encodeURIComponent(flow)}/run` : "/api/flows/login/start";
    FlowClient.mount(document.getElementById("app"), {
      start: () => FlowClient.post(startUrl),
      submit: (view, input) => FlowClient.post(`/api/sessions/${encodeURIComponent(view.sessionId)}/submit`, { nodeId: view.nodeId, input }),
      footer: flow ? () => FlowClient.el("div", { class: "footer" }, FlowClient.el("a", { href: `/?flow=${encodeURIComponent(flow)}` }, "Back to the whiteboard")) : undefined,
    });
  </script>
</body>
</html>
